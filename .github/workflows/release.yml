name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.2.0)"
        required: true
        default: "v0.2.0"

permissions:
  contents: write

jobs:
  release:
    name: R8 Minified Release APK, AAB & GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare Release Keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            KEYSTORE_FILE="$RUNNER_TEMP/pixelcraft-release.jks"
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          fi


      - name: Assemble R8-Minified Signed Release APK & Play Store AAB
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/pixelcraft-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Verify R8 Mapping, Signature & Package Release Assets
        run: |
          TAG_NAME="${{ github.event.inputs.tag_name || github.ref_name }}"
          VERSION="${TAG_NAME#v}"

          MAPPING_FILE="app/build/outputs/mapping/release/mapping.txt"
          if [ ! -s "$MAPPING_FILE" ]; then
            echo "ERROR: R8 mapping.txt was not generated or is empty!"
            exit 1
          fi
          echo "R8 mapping lines: $(wc -l < "$MAPPING_FILE")"

          RAW_APK=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ] || [ ! -f "$RAW_APK" ]; then
            echo "ERROR: Release APK not found!"
            exit 1
          fi

          RAW_AAB=$(find app/build/outputs/bundle/release -maxdepth 1 -name "*.aab" | head -n 1)
          if [ -z "$RAW_AAB" ] || [ ! -f "$RAW_AAB" ]; then
            echo "ERROR: Release AAB not found!"
            exit 1
          fi

          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT_VER=$(ls -1 "$SDK_DIR/build-tools" | sort -V | tail -n 1)
          "$SDK_DIR/build-tools/$BT_VER/apksigner" verify --verbose "$RAW_APK"

          mkdir -p release-dist
          OUT_APK="release-dist/PixelCraft-${VERSION}-release.apk"
          OUT_AAB="release-dist/PixelCraft-${VERSION}-release.aab"
          cp "$RAW_APK" "$OUT_APK"
          cp "$RAW_AAB" "$OUT_AAB"
          (cd release-dist && sha256sum "PixelCraft-${VERSION}-release.apk" "PixelCraft-${VERSION}-release.aab" > "PixelCraft-${VERSION}-checksums.sha256")

          APK_SIZE=$(du -h "$OUT_APK" | cut -f1)
          AAB_SIZE=$(du -h "$OUT_AAB" | cut -f1)
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK_SIZE=$APK_SIZE" >> "$GITHUB_ENV"
          echo "AAB_SIZE=$AAB_SIZE" >> "$GITHUB_ENV"

          {
            echo "### Release Build Summary (\`$TAG_NAME\`)"
            echo "- **APK**: \`PixelCraft-${VERSION}-release.apk\` (**$APK_SIZE**)"
            echo "- **AAB**: \`PixelCraft-${VERSION}-release.aab\` (**$AAB_SIZE**)"
            echo "- **R8 Minification & Resource Shrinking**: Enabled (\`mapping.txt\` verified)"
            echo "- **APK Signature (V1/V2/V3)**: Verified via \`apksigner\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload R8 Mapping Artifact
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-${{ env.VERSION }}
          path: app/build/outputs/mapping/release/
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          cat <<EOF > "$NOTES_FILE"
          ## PixelCraft ${TAG_NAME}

          R8-minified, resource-shrunk, signed Android release APK (**${APK_SIZE}**) & Play Store App Bundle (**${AAB_SIZE}**, \`minSdk 28\` / \`targetSdk 35\`).

          ### Highlights
          - **Home Workspace & Crash-Safe Autosave**: Dedicated project gallery with 256px WebP thumbnails, atomic project writes, and automatic draft recovery.
          - **Direct Multi-Touch Manipulation**: Two-finger pinch-scale & twist-rotate with \`±4°\` cardinal snapping, 48dp corner/side selection handles, and \`0.5x–6x\` canvas zoom & pan.
          - **Advanced Typography**: 15 bundled open-source fonts + custom \`.ttf\`/\`.otf\` import, curved arc text, letter spacing, linear/radial gradient fill, neon outer glow, 3D extrusion, and saved styles.
          - **Vector Shapes & Photo Studio**: 24 vector shapes & word balloons, photo crop, brightness/contrast/saturation/warmth adjustments, 8 filter presets, shape masks, and composite blend modes.
          - **Export & Portable Archives**: OOM-safe PNG, JPEG & WebP (Lossy/Lossless) export, direct share without gallery clutter, and portable \`.pixelcraft\` project archives.
          EOF

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-dist/* --clobber
            gh release edit "$TAG_NAME" --title "PixelCraft ${TAG_NAME}" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG_NAME" release-dist/* \
              --title "PixelCraft ${TAG_NAME}" \
              --notes-file "$NOTES_FILE"
          fi

      - name: Cleanup Temporary Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/pixelcraft-release.jks"
